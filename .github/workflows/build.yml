name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npm install -g @capacitor/cli @capacitor/core

      - name: Build Web Assets
        run: npm run build --if-present || npx tsc || echo "No build script needed"

      - name: Ensure www directory exists
        run: mkdir -p www && touch www/index.html

      - name: Ensure valid Capacitor Config
        run: |
          # Creamos o aseguramos un capacitor.config.json con el appId obligatorio que pide Capacitor
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.webrune.app",
            "appName": "Webrune",
            "webDir": "www"
          }
          EOF

      - name: Clean and Recreate iOS Platform
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Build iOS App
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos archive -archivePath App.xcarchive CODE_SIGNING_ALLOWED=NO
          mkdir Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r Webrune.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Webrune-IPA
          path: ios/App/Webrune.ipa
