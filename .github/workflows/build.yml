name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -g @capacitor/cli
          npm install @capacitor/core@latest @capacitor/ios@latest --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build --if-present || npx tsc || echo "No build script needed"

      - name: Ensure www directory exists
        run: mkdir -p www && touch www/index.html

      - name: Force Initialize Capacitor iOS Platform
        run: |
          # 1. Limpiamos configuración vieja y forzamos el config.json
          rm -f capacitor.config.ts capacitor.config.js
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.webrune.app",
            "appName": "Webrune",
            "webDir": "www"
          }
          EOF

          # 2. Borramos cualquier rastro corrupto de ios
          rm -rf ios

          # 3. Inicializamos la plataforma forzando la creación mediante npx cap sync (que autogenera ios si no está)
          npx cap sync ios

          # 4. Blindaje total: si por alguna razón el Podfile sigue sin estar, lo creamos a la fuerza
          mkdir -p ios/App
          if [ ! -f ios/App/Podfile ]; then
            cat << 'EOF' > ios/App/Podfile
          require_relative '../../node_modules/@capacitor/ios/scripts/pods'

          platform :ios, '13.0'
          use_frameworks!

          target 'App' do
            capacitor_pods
          end
          EOF
          fi

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Build iOS App
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos archive -archivePath App.xcarchive CODE_SIGNING_ALLOWED=NO
          mkdir Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r Webrune.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Webrune-IPA
          path: ios/App/Webrune.ipa
